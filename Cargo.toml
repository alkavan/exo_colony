[package]
name = "exo_colony"
version = "0.2.0"
authors = ["Igal Alkon <igal@alkontek.com>"]
edition = "2024"
description = "A real-time simulation game about building a colony on an exo-planet for terminal lovers."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossterm = "0.29.0"
tui = { version = "0.19.0", default-features = false, features = ["termion"] }   # works on Linux
#tui = { version = "0.19.0", default-features = false, features = ["crossterm"] } # works on Windows
rand = "0.10.1"
chrono = "0.4"
itertools = "0.15.0"
worldgen = "0.5"
encode_unicode = "1.0.0"
